---
name: Deploy

concurrency:
  group: queue

on:
  push:
    branches:
      - main
      - 'renovate/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  release:
    types:
      - published
      - edited
  workflow_dispatch:

env:
  USERNAME: ${{ github.repository_owner }}
  PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write


jobs:
  lint_zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
      # contents: read         # Only needed for private repos. Needed to clone the repo.
      # actions: read          # Only needed for private repos. Needed for upload-sarif to read workflow run info.
    steps:
        # check out code from GitHub
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
          with:
            persist-credentials: false
        - name: Run zizmor 🌈
          uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1

  lint_shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
        # check out code from GitHub
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
          with:
            persist-credentials: false
        # check bash integrity
        - name: Run ShellCheck
          uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
          with:
            scandir: './docker'
            severity: warning
          env:
            SHELLCHECK_OPTS: -s bash

  lint_hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
        # check out code from GitHub
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
          with:
            persist-credentials: false
        # check dockerfile integrity
        - name: Run hadolint
          uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
          with:
              ignore: DL3002
              dockerfile: ./docker/Dockerfile

  lint_dockercompose:
    name: test docker-compose
    runs-on: ubuntu-latest
    steps:
        # check out code from GitHub
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
          with:
            persist-credentials: false
        # check compose.yml integrity
        - name: Lint docker-compose.yml
          run: |
            docker compose -f docker/docker-compose.yml config --quiet




  build:
    needs:
      - lint_zizmor
      - lint_shellcheck
      - lint_hadolint
      - lint_dockercompose
    name: Build docker image
    runs-on: ubuntu-latest

    steps:
        # check out code from GitHub
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
          with:
            persist-credentials: false

        # Set up QEMU for allow possibility to buil multi arch
        # https://github.com/docker/setup-qemu-action
        - name: Set up QEMU
          uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.2.0

        # Set up BuildKit Docker container builder to be able to build
        # multi-platform images and export cache
        # https://github.com/docker/setup-buildx-action
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

        # Login against a Docker registry except on PR
        # https://github.com/docker/login-action
        - name: Log in to the Container registry
          if: |
            (github.event_name == 'push' && github.triggering_actor == github.repository_owner) ||
             github.event_name == 'pull_request' ||
             github.event_name == 'release'
          uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ env.USERNAME }}
            password: ${{ env.PASSWORD }}

        # Extract metadata (tags, labels) for Docker
        # https://github.com/docker/metadata-action
        - name: Extract Docker metadata
          id: metadata
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
          with:
            images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            tags: |
              # Following TAG are for tag the branche
              type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
              type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
              # Following TAG are always apply
              type=sha,prefix=sha-,format=short,enable=true
              # Following TAG are applied IF event from 'release'
              type=raw,value=latest,enable=${{ github.event_name == 'release' }}
              type=semver,pattern={{version}},prefix=v,enable=${{ github.event_name == 'release' }}
        - name: Debug metadata
          run: |
            echo "github.ref:"
            echo "${{ github.ref }}"
            echo
            echo "github.ref_name:"
            echo "${{ github.ref_name }}"
            echo
            echo "action:"
            echo "${{ github.action }}"
            echo
            echo "action_path:"
            echo "${{ github.action_path }}"
            echo
            echo "action_ref:"
            echo "${{ github.action_ref }}"
            echo
            echo "actor:"
            echo "${{ github.actor }}"
            echo
            echo "event:"
            echo "${{ github.event }}"
            echo
            echo "event_name:"
            echo "${{ github.event_name }}"
            echo
            echo "head_ref:"
            echo "${{ github.head_ref }}"
            echo
            echo "ref_type:"
            echo "${{ github.ref_type }}"
            echo
            echo "repository_owner:"
            echo "${{ github.repository_owner }}"
            echo
            echo "retention_days:"
            echo "${{ github.retention_days }}"
            echo
            echo "triggering_actor:"
            echo "${{ github.triggering_actor }}"
            echo
            echo "Tags:"
            echo "${{ steps.metadata.outputs.tags }}"
            echo
            echo "Labels:"
            echo "${{ steps.metadata.outputs.labels }}"

              # XXXXXXX SEE   https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
        # Build and push Docker image with Buildx (build if release, PR or push by autor)
        # https://github.com/docker/build-push-action
        - name: Build and push Docker image
          id: build-and-push
          uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
          with:
            context: ./docker
            file: ./docker/Dockerfile
            platforms: linux/amd64
            push: ${{ (github.event_name == 'push' && github.triggering_actor == github.repository_owner) || github.event_name == 'pull_request' || github.event_name == 'release' }}
            tags: ${{ steps.metadata.outputs.tags }}
            labels: ${{ steps.metadata.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max